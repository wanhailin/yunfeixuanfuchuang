<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>货运速算</title>
<style>
:root{
    --bg:#050b18;
    --card:#0f172a;
    --card-border:rgba(255,255,255,0.08);
    --text:#e2e8f0;
    --text-sub:#94a3b8;
    --input:#1e293b;
    --input-border:rgba(255,255,255,0.08);
    --input-focus:#38bdf8;
    --primary:#3b82f6;
    --success:#34d399;
    --danger:#f87171;
    --divider:rgba(255,255,255,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
html,body{
    touch-action: manipulation;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
}
body{
    color:var(--text);
    background:var(--bg);
    padding:10px;
    min-width:260px;
}
summary{
    padding:8px 10px;
    border-radius:8px;
    background:#141e33;
    cursor:pointer;
    font-size:13px;
    color:#94a3b8;
}
details{
    margin-bottom:10px;
    border-radius:10px;
    overflow:hidden;
}
details[open]{
    background:#0e1729;
    padding:8px;
}
.big-textarea{
    width:100%;
    min-height:68px;
    border-radius:10px;
    border:1px solid rgba(56,189,248,0.4);
    background:var(--input);
    color:var(--text);
    padding:10px;
    font-size:15px;
    outline:none;
    resize:none;
    margin-bottom:10px;
}
.hint-text{
    font-size:11px;
    color:#7dd3fc;
    margin-bottom:8px;
}
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
}
.form-item label{
    font-size:11px;
    color:var(--text-sub);
    margin-bottom:3px;
    display:block;
}
.form-item input,.form-item select{
    width:100%;
    height:38px;
    padding:0 8px;
    border:1px solid var(--input-border);
    border-radius:8px;
    font-size:14px;
    color:var(--text);
    background:var(--input);
    outline:none;
}
.form-item.full{
    grid-column: span 2;
}
.result-box{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
}
.profit-num{
    text-align:center;
    font-size:32px;
    font-weight:900;
    margin:6px 0;
    color:var(--success);
}
.profit-num.bad{color:var(--danger);}
.perkm-text{
    text-align:center;
    font-size:14px;
    color:#cbd5e1;
    margin-bottom:8px;
}
.tip-text{
    text-align:center;
    font-size:14px;
    font-weight:bold;
    padding:8px;
    border-radius:8px;
}
.tip-good{background:rgba(52,211,153,0.12);color:var(--success);}
.tip-bad{background:rgba(248,113,113,0.12);color:var(--danger);}
.btn-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:8px 0 12px;
}
button{
    height:42px;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}
.btn-calc{
    background:var(--primary);
    color:#fff;
}
.btn-clear{
    background:#272d3b;
    color:#b1b8c4;
}
</style>
</head>
<body>
<div class="hint-text">🎤点击上方输入框，输入法麦克风说话：550公里，运费3300，放空40</div>
<textarea class="big-textarea" id="voiceTextArea" placeholder="口述货源信息"></textarea>
<div class="form-grid">
    <div class="form-item">
        <label>里程 km</label>
        <input type="number" id="mainKm">
    </div>
    <div class="form-item">
        <label>运费 元</label>
        <input type="number" id="mainMoney">
    </div>
    <div class="form-item">
        <label>放空 km</label>
        <input type="number" id="emptyKm">
    </div>
    <div class="form-item">
        <label>放空高速 km</label>
        <input type="number" id="emptyHigh">
    </div>
</div>
<div class="btn-row">
    <button class="btn-calc" id="btnCalc">计算并播报</button>
    <button class="btn-clear" id="btnClear">清空</button>
</div>
<div class="result-box" id="resultBox" style="display:none;">
    <div style="text-align:center;font-size:12px;color:#94a3b8">预估净赚</div>
    <div class="profit-num" id="profitDisplay">0.00</div>
    <div class="perkm-text" id="perKmDisplay">每公里净赚：0.00元</div>
    <div class="tip-text tip-good" id="tipDisplay">--</div>
</div>
<!-- 高级参数，默认折叠 -->
<details>
    <summary>⚙️高级参数（油耗/油价/底价/语音测试）</summary>
    <div class="form-grid">
        <div class="form-item">
            <label>油耗 L/100km</label>
            <select id="oilUse">
                <option value="17">空/轻载17</option>
                <option value="21" selected>标载21</option>
                <option value="23">重载23</option>
            </select>
        </div>
        <div class="form-item">
            <label>柴油 元/升</label>
            <input type="number" step="0.1" id="oilPrice" value="7.8">
        </div>
        <div class="form-item">
            <label>高速费元/km</label>
            <input type="number" step="0.1" id="roadPrice" value="1.1">
        </div>
        <div class="form-item">
            <label>接单底价元/km</label>
            <input type="number" step="0.1" id="basePrice" value="1.0">
        </div>
        <div class="form-item full">
            <button style="width:100%;background:#1e40af;color:#fff;" id="btnTestVoice">🔊 测试语音播报</button>
        </div>
    </div>
</details>
<script>
const EMPTY_OIL_RATE = 16;
const cacheKeys = ['oilUse','oilPrice','roadPrice','basePrice','mainKm','mainMoney','emptyKm','emptyHigh'];
// ========== 语音播报兼容修复：适配华为/安卓系统 ==========
var supportSpeak = 'speechSynthesis' in window;
var voiceList = [];
// 预加载语音音色列表
function loadVoiceList(){
    if(!supportSpeak) return;
    voiceList = window.speechSynthesis.getVoices();
}
if(supportSpeak){
    loadVoiceList();
    window.speechSynthesis.onvoiceschanged = loadVoiceList;
}
// 金额格式化
function formatMoney(n){
    if(isNaN(n)) return "0.00";
    return Number(n).toFixed(2);
}
// 读取输入数值，非法值归零
function getNum(id){
    var v = parseFloat(document.getElementById(id).value);
    return isNaN(v)||v<0 ? 0 : v;
}
// 本地存储缓存全部参数
function saveCache(){
    try{
        var data = {};
        cacheKeys.forEach(function(k){
            var el = document.getElementById(k);
            if(el) data[k]=el.value;
        });
        localStorage.setItem("truckCalcMini",JSON.stringify(data));
    }catch(e){}
}
// 页面加载读取缓存回填
function loadCache(){
    try{
        var d = JSON.parse(localStorage.getItem("truckCalcMini")||"{}");
        cacheKeys.forEach(function(k){
            var el = document.getElementById(k);
            if(d[k]!==undefined && el) el.value = d[k];
        })
    }catch(e){}
}
// 语音播报函数
function speakResult(profit,perKm,isOk){
    if(!supportSpeak){
        alert("当前浏览器不支持语音播报功能，请使用华为自带浏览器或Chrome");
        return;
    }
    window.speechSynthesis.cancel();
    var roundProfit = Math.round(profit);
    var text = "单趟净赚" + roundProfit + "元，每公里净赚" + perKm.toFixed(1) + "元。";
    text += isOk ? "符合标准，可以承接。" : "低于底价，不建议承接。";
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-CN";
    utter.rate = 1.0;
    utter.volume = 1.0;
    // 匹配中文语音解决安卓播报乱码/无声
    var zhVoice = voiceList.find(function(v){
        return v.lang.toLowerCase().includes('zh') || v.lang.includes('CN');
    });
    if(zhVoice) utter.voice = zhVoice;
    utter.onerror = function(e){
        console.log("播报错误:", e);
        alert("播报失败，请检查手机文字转语音设置，或部署到HTTPS网页后使用");
    };
    window.speechSynthesis.speak(utter);
}
// 解析文本框口述文字提取里程、运费、放空
function parseInputText(text){
    if(!text) return;
    var nums = text.match(/\d+(\.\d+)?/g);
    if(!nums) return;
    var arrNum = nums.map(Number);
    var km=null,money=null,empty=null;
    var kmMatch = text.match(/(\d+(\.\d+)?)[公里|km|千米]/);
    var moneyMatch = text.match(/运费[^\d]*(\d+(\.\d+)?)/);
    var emptyMatch = text.match(/放空[^\d]*(\d+(\.\d+)?)/);
    if(kmMatch) km=Number(kmMatch[1]);
    if(moneyMatch) money=Number(kmMatch[1]);
    if(emptyMatch) empty=Number(emptyMatch[1]);
    var remain = arrNum.filter(function(n){ return n!==km && n!==money && n!==empty; });
    if(km===null && remain.length>0) km=remain.shift();
    if(money===null && remain.length>0) money=remain.shift();
    if(empty===null && remain.length>0) empty=remain.shift();
    if(km!==null) document.getElementById("mainKm").value=km;
    if(money!==null) document.getElementById("mainMoney").value=money;
    if(empty!==null) document.getElementById("emptyKm").value=empty;
    saveCache();
}
// 核心成本计算
function calculate(){
    var oilUse = Number(document.getElementById("oilUse").value);
    var oilPrice = getNum("oilPrice");
    var roadPrice = getNum("roadPrice");
    var basePrice = getNum("basePrice");
    var mainKm = getNum("mainKm");
    var mainMoney = getNum("mainMoney");
    var emptyKm = getNum("emptyKm");
    var emptyHigh = getNum("emptyHigh");
    // 载货成本
    var mainOil = mainKm * oilUse /100 * oilPrice;
    var mainRoad = mainKm * roadPrice;
    // 放空成本
    var emptyOil = emptyKm * EMPTY_OIL_RATE /100 * oilPrice;
    var emptyRoad = emptyHigh * roadPrice;
    var totalCost = mainOil + mainRoad + emptyOil + emptyRoad;
    var profit = mainMoney - totalCost;
    var totalKm = mainKm + emptyKm;
    var perKm = totalKm>0 ? profit/totalKm : 0;
    var isOk = perKm >= basePrice;
    // 渲染结果面板
    var resBox = document.getElementById("resultBox");
    resBox.style.display="block";
    var profitDom = document.getElementById("profitDisplay");
    profitDom.innerText = formatMoney(profit);
    profitDom.className = "profit-num" + (profit<0?" bad":"");
    document.getElementById("perKmDisplay").innerText = "每公里净赚："+formatMoney(perKm)+"元";
    var tipDom = document.getElementById("tipDisplay");
    if(profit>=0 && isOk){
        tipDom.className="tip-text tip-good";
        tipDom.innerText="✅符合接单标准，可以接";
    }else if(profit>=0 && !isOk){
        tipDom.className="tip-text tip-bad";
        tipDom.innerText="⚠️低于底价，谨慎接单";
    }else{
        tipDom.className="tip-text tip-bad";
        tipDom.innerText="❌亏本，不要接";
    }
    saveCache();
    return { profit:profit, perKm:perKm, isOk:isOk };
}
document.addEventListener('DOMContentLoaded',function(){
    loadCache();
    var textArea = document.getElementById("voiceTextArea");
    // 文本框失焦：仅解析+计算，不播报（规避浏览器自动语音拦截）
    textArea.addEventListener("blur",function(){
        parseInputText(textArea.value.trim());
        calculate();
    });
    // 手动点击计算按钮：计算+语音播报（用户主动交互，无拦截）
    document.getElementById("btnCalc").onclick = function(){
        var res = calculate();
        speakResult(res.profit, res.perKm, res.isOk);
    };
    // 语音播报测试按钮
    document.getElementById("btnTestVoice").onclick = function(){
        speakResult(1000, 1.2, true);
    };
    // 清空按钮
    document.getElementById("btnClear").onclick = function(){
        textArea.value="";
        document.getElementById("mainKm").value="";
        document.getElementById("mainMoney").value="";
        document.getElementById("emptyKm").value="";
        document.getElementById("emptyHigh").value="";
        document.getElementById("resultBox").style.display="none";
        if(supportSpeak) window.speechSynthesis.cancel();
        saveCache();
    };
    // 所有输入框修改自动缓存
    document.querySelectorAll("#mainKm,#mainMoney,#emptyKm,#emptyHigh,#oilUse,#oilPrice,#roadPrice,#basePrice").forEach(function(el){
        el.addEventListener("change",saveCache);
    });
});
</script>
</body>
</html>
